<!--
  SkyrScout / Scoutland Yard
  Public Hese-Fredrik floating alert widget

  Hidden unless backend says an alert is active.
-->

<style>
    #hese-fredrik[hidden] {
        display: none !important;
    }

    #hese-fredrik {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 9999;
        width: min(470px, calc(100vw - 48px));
        border: 1px solid rgba(255, 92, 92, 0.95);
        border-radius: 14px;
        overflow: hidden;
        background:
            radial-gradient(circle at 18% 10%, rgba(178, 32, 32, 0.24), transparent 34%),
            linear-gradient(135deg, rgba(16, 20, 24, 0.985), rgba(7, 10, 13, 0.985));
        box-shadow:
            0 18px 48px rgba(0, 0, 0, 0.58),
            0 0 0 1px rgba(255,255,255,0.03),
            0 0 24px rgba(214, 45, 45, 0.18);
        backdrop-filter: blur(8px);
        animation: heseFredrikIn 420ms cubic-bezier(.2,.9,.25,1);
    }

    #hese-fredrik::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 5px;
        background: linear-gradient(#ff6d6d, #b41414);
        z-index: 2;
    }

    @keyframes heseFredrikIn {
        from {
            opacity: 0;
            transform: translate3d(30px, 18px, 0) scale(.97);
        }
        to {
            opacity: 1;
            transform: translate3d(0, 0, 0) scale(1);
        }
    }

    .hese-fredrik-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 12px 8px 16px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        background: rgba(150, 20, 20, 0.15);
    }

    .hese-fredrik-label {
        margin: 0;
        color: #ff7777;
        font-size: 0.72rem;
        font-weight: 900;
        letter-spacing: 0.13em;
        text-transform: uppercase;
    }

    .hese-fredrik-close {
        width: 30px;
        height: 30px;
        border: 0;
        border-radius: 50%;
        background: rgba(255,255,255,0.08);
        color: #fff;
        font: inherit;
        font-size: 1.05rem;
        line-height: 1;
        cursor: pointer;
    }

    .hese-fredrik-close:hover {
        background: rgba(255,255,255,0.14);
    }

    .hese-fredrik-body {
        display: grid;
        grid-template-columns: 170px minmax(0, 1fr);
        min-height: 142px;
        align-items: stretch;
    }

    .hese-fredrik-image {
        display: block;
        position: relative;
        align-self: center;
        width: calc(100% - 14px);
        aspect-ratio: 16 / 9;
        min-height: 0;
        margin: 10px 0 10px 12px;
        overflow: hidden;
        border-radius: 8px;
        background: #080a0c;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
    }

    .hese-fredrik-image img {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 0;
        object-fit: contain;
        object-position: center;
        background: #080a0c;
    }

    .hese-fredrik-image::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent 78%, rgba(7,10,13,0.22) 100%);
        pointer-events: none;
    }

    .hese-fredrik-copy {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 7px;
        min-width: 0;
        padding: 16px 18px 16px 14px;
    }

    .hese-fredrik-copy h2 {
        margin: 0;
        color: #fff;
        font-family: Arial, Helvetica, "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
        font-size: 1.12rem;
        line-height: 1.15;
        overflow-wrap: anywhere;
        font-variant-emoji: emoji;
    }

    .hese-fredrik-movement {
        margin: 0;
        color: #fff;
        font-size: 0.92rem;
        font-weight: 800;
    }

    .hese-fredrik-movement strong {
        color: #ff7777;
        font-size: 1.12rem;
    }

    .hese-fredrik-note {
        margin: 0;
        color: #aeb8c2;
        font-size: 0.76rem;
        line-height: 1.35;
    }

    .hese-fredrik-action[hidden] {
        display: none !important;
    }

    .hese-fredrik-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 2px;
    }

    .hese-fredrik-action {
        display: inline-flex;
        align-items: center;
        padding: 7px 10px;
        border: 1px solid rgba(255, 98, 98, 0.9);
        border-radius: 7px;
        color: #fff !important;
        background: rgba(151, 28, 28, 0.88);
        font-size: 0.76rem;
        font-weight: 800;
        line-height: 1.15;
        text-decoration: none !important;
    }

    .hese-fredrik-action:hover {
        background: rgba(183, 34, 34, 0.95);
    }

    .hese-fredrik-action--youtube {
        border-color: rgba(255,255,255,0.20);
        background: rgba(255,255,255,0.065);
        color: #dce4e8 !important;
    }

    .hese-fredrik-action--youtube:hover {
        background: rgba(255,255,255,0.12);
        color: #fff !important;
    }


    #hese-fredrik-muted-toggle[hidden] {
        display: none !important;
    }

    #hese-fredrik-muted-toggle {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 9998;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 8px 11px;
        border: 1px solid rgba(255,255,255,0.16);
        border-radius: 999px;
        background: rgba(10, 13, 16, 0.94);
        color: #aeb8c2;
        box-shadow: 0 10px 28px rgba(0,0,0,0.42);
        font: inherit;
        font-size: 0.72rem;
        cursor: pointer;
    }

    #hese-fredrik-muted-toggle:hover {
        color: #fff;
        border-color: rgba(255, 119, 119, 0.55);
    }

    .hese-fredrik-controls {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .hese-fredrik-mute {
        border: 0;
        background: transparent;
        color: #c8d0d8;
        font: inherit;
        font-size: 0.68rem;
        font-weight: 800;
        cursor: pointer;
        padding: 5px 6px;
        border-radius: 6px;
    }

    .hese-fredrik-mute:hover {
        background: rgba(255,255,255,0.08);
        color: #fff;
    }

    @media (max-width: 680px) {
        #hese-fredrik {
            right: 12px;
            bottom: 12px;
            left: 12px;
            width: auto;
        }

        #hese-fredrik-muted-toggle {
            right: 12px;
            bottom: 12px;
            font-size: 0.66rem;
        }

        .hese-fredrik-body {
            grid-template-columns: 122px minmax(0, 1fr);
            min-height: 118px;
        }

        .hese-fredrik-image {
            width: calc(100% - 10px);
            min-height: 0;
            margin: 8px 0 8px 8px;
            border-radius: 7px;
        }

        .hese-fredrik-image img {
            min-height: 0;
        }

        .hese-fredrik-topbar {
            padding: 8px 9px 7px 14px;
        }

        .hese-fredrik-label {
            font-size: 0.61rem;
        }

        .hese-fredrik-copy {
            gap: 5px;
            padding: 11px 12px 11px 10px;
        }

        .hese-fredrik-copy h2 {
            font-size: 0.93rem;
        }

        .hese-fredrik-movement {
            font-size: 0.77rem;
        }

        .hese-fredrik-movement strong {
            font-size: 1rem;
        }

        .hese-fredrik-note {
            font-size: 0.65rem;
        }

        .hese-fredrik-action {
            padding: 6px 8px;
            font-size: 0.68rem;
        }
    }
</style>

<section id="hese-fredrik" aria-live="polite" hidden>
    <div class="hese-fredrik-topbar">
        <p class="hese-fredrik-label">🚨 Hese-Fredrik Alert</p>

        <div class="hese-fredrik-controls">
            <button
                class="hese-fredrik-mute"
                id="hese-fredrik-mute"
                type="button"
                aria-label="Mute Hese-Fredrik alerts on this device"
            >Mute alerts</button>

            <button
                class="hese-fredrik-close"
                id="hese-fredrik-close"
                type="button"
                aria-label="Close Hese-Fredrik alert"
            >×</button>
        </div>
    </div>

    <div class="hese-fredrik-body">
        <a
            class="hese-fredrik-image"
            id="hese-fredrik-image-link"
            href="#"
            aria-label="Open the highlighted SkyrScout video"
        >
            <img id="hese-fredrik-thumbnail" src="" alt="">
        </a>

        <div class="hese-fredrik-copy">
            <h2 id="hese-fredrik-title"></h2>

            <p class="hese-fredrik-movement">
                <strong id="hese-fredrik-delta"></strong>
                <span id="hese-fredrik-window"></span>
            </p>

            <p class="hese-fredrik-note">
                This SkyrScout video is moving unusually fast on YouTube.
            </p>

            <div class="hese-fredrik-actions">
                <a
                    class="hese-fredrik-action"
                    id="hese-fredrik-site-action"
                    href="#"
                    hidden
                >
                    View Short profile →
                </a>
                <a
                    class="hese-fredrik-action hese-fredrik-action--youtube"
                    id="hese-fredrik-youtube-action"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Watch on YouTube ↗
                </a>
            </div>
        </div>
    </div>
</section>

<button
    id="hese-fredrik-muted-toggle"
    type="button"
    hidden
    aria-label="Turn Hese-Fredrik alerts back on"
>🔕 Hese-Fredrik off</button>

<script>
(function () {
    "use strict";

    const HESE_FREDRIK_ENDPOINT = "https://script.google.com/macros/s/AKfycbw5hZ4rk0e4OwClAtrH3-K9g4Z_XBu00a61Lx-aqdlv_KRXxZhJhR3WGFynE9W2WY5Z/exec";
    const HESE_FREDRIK_REFRESH_MS = 60 * 1000;
    const widget = document.querySelector("#hese-fredrik");
    const closeButton = document.querySelector("#hese-fredrik-close");
    const muteButton = document.querySelector("#hese-fredrik-mute");
    const mutedToggle = document.querySelector("#hese-fredrik-muted-toggle");
    const MUTE_KEY = "skyrscout-hese-fredrik-muted";

    if (!widget) {
        return;
    }

    function isMuted() {
        return localStorage.getItem(MUTE_KEY) === "1";
    }

    function setMuted(value) {
        if (value) {
            localStorage.setItem(MUTE_KEY, "1");
            widget.hidden = true;
            if (mutedToggle) {
                mutedToggle.hidden = false;
            }
        } else {
            localStorage.removeItem(MUTE_KEY);
            if (mutedToggle) {
                mutedToggle.hidden = true;
            }
        }
    }

    if (isMuted() && mutedToggle) {
        mutedToggle.hidden = false;
    }

    const siteEntries = {};

    {% for player in site.players %}
        {% if player.youtube %}
            {% assign hf_player_youtube_id = player.youtube
                | split: 'v='
                | last
                | split: '&'
                | first
                | split: '/'
                | last
            %}
            siteEntries[{{ hf_player_youtube_id | jsonify }}] = {
                url: {{ player.url | relative_url | jsonify }},
                kind: "player"
            };
        {% endif %}
    {% endfor %}

    {% for short in site.shorts %}
        {% if short.youtube %}
            {% assign hf_short_youtube_id = short.youtube
                | split: 'shorts/'
                | last
                | split: '?'
                | first
                | split: '&'
                | first
            %}
            siteEntries[{{ hf_short_youtube_id | jsonify }}] = {
                url: {{ short.url | relative_url | jsonify }},
                kind: "short",
                title: {{ short.title | jsonify }}
            };
        {% endif %}
    {% endfor %}

    let dismissedVideoId = null;

    closeButton?.addEventListener("click", function () {
        dismissedVideoId = widget.dataset.videoId || null;
        widget.hidden = true;
    });

    muteButton?.addEventListener("click", function () {
        setMuted(true);
    });

    mutedToggle?.addEventListener("click", function () {
        setMuted(false);
        dismissedVideoId = null;

        if (window.__lastHeseFredrikPayload) {
            window.SkyrScoutHeseFredrik(window.__lastHeseFredrikPayload);
        }
    });

    window.SkyrScoutHeseFredrik = function (payload) {
        window.__lastHeseFredrikPayload = payload;

        if (isMuted()) {
            widget.hidden = true;
            if (mutedToggle) {
                mutedToggle.hidden = false;
            }
            return;
        }

        if (mutedToggle) {
            mutedToggle.hidden = true;
        }

        if (
            !payload ||
            payload.active !== true ||
            !payload.alert
        ) {
            dismissedVideoId = null;
            widget.hidden = true;
            return;
        }

        const alert = payload.alert;

        if (dismissedVideoId && dismissedVideoId === alert.videoId) {
            return;
        }

        const siteEntry = siteEntries[alert.videoId] || null;
        const youtubeUrl =
            alert.videoUrl ||
            ("https://www.youtube.com/watch?v=" + alert.videoId);
        const targetUrl = siteEntry ? siteEntry.url : youtubeUrl;
        const displayTitle =
            siteEntry && siteEntry.kind === "short" && siteEntry.title
                ? siteEntry.title
                : (alert.title || "SkyrScout video");

        widget.dataset.videoId = alert.videoId || "";

        const heseTitle = document.querySelector("#hese-fredrik-title");
        heseTitle.textContent = displayTitle;

        // Windows does not natively render regional-indicator flag emoji.
        // Re-run Twemoji after every live title update so flags stay visible.
        if (window.twemoji) {
            twemoji.parse(heseTitle, {
                folder: "svg",
                ext: ".svg"
            });
        }

        document.querySelector("#hese-fredrik-delta").textContent =
            "+" + Number(alert.deltaViews || 0).toLocaleString("en-US") + " views";

        document.querySelector("#hese-fredrik-window").textContent =
            alert.windowLabel
                ? " · " + alert.windowLabel
                : " in " + Number(alert.windowMinutes || 0) + " minutes";

        const thumbnail = document.querySelector("#hese-fredrik-thumbnail");
        thumbnail.src =
            alert.thumbnail ||
            ("https://img.youtube.com/vi/" + alert.videoId + "/hqdefault.jpg");
        thumbnail.alt = displayTitle;

        document.querySelector("#hese-fredrik-image-link").href = targetUrl;

        const siteAction = document.querySelector("#hese-fredrik-site-action");
        const youtubeAction = document.querySelector("#hese-fredrik-youtube-action");

        if (siteEntry) {
            siteAction.hidden = false;
            siteAction.href = siteEntry.url;
            siteAction.textContent =
                siteEntry.kind === "short"
                    ? "View Short profile →"
                    : "View player profile →";
        } else {
            siteAction.hidden = true;
            siteAction.removeAttribute("href");
        }

        youtubeAction.href = youtubeUrl;

        widget.hidden = false;
    };

    function refreshHeseFredrik() {
        const script = document.createElement("script");
        const separator = HESE_FREDRIK_ENDPOINT.indexOf("?") === -1 ? "?" : "&";

        script.src =
            HESE_FREDRIK_ENDPOINT +
            separator +
            "callback=SkyrScoutHeseFredrik&_=" +
            Date.now();

        script.async = true;

        script.onload = function () {
            script.remove();
        };

        script.onerror = function () {
            script.remove();
        };

        document.head.appendChild(script);
    }

    refreshHeseFredrik();
    window.setInterval(refreshHeseFredrik, HESE_FREDRIK_REFRESH_MS);
})();
</script>
