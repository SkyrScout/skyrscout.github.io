<header class="site-header">

    <img
        src="/assets/images/banner.png"
        alt="SkyrScout"
        class="site-banner"
    >

    <nav class="navigation">

        <input
            type="checkbox"
            id="menu-toggle"
            class="menu-toggle"
        >

        <label
            for="menu-toggle"
            class="menu-button"
            aria-label="Open navigation menu"
        >
            <span></span>
            <span></span>
            <span></span>
        </label>

        <div class="navigation-links">
            <a href="/">Home</a>
            <a href="/players/">Players</a>
            <a href="/shorts/">Shorts</a>
            <a href="/updates/">Updates</a>
            <a href="/podcast/">Podcast</a>
            <a href="/music/">Music</a>
            <a href="/about/">About</a>
        </div>

    </nav>

    {% unless page.robots contains 'noindex' %}
        <div class="preferred-source-strip">
            <span class="preferred-source-copy">
                Make SkyrScout a preferred source in Google Search.
            </span>

            <div
                class="preferred-source-button"
                google-add-preferred-source-btn
                data-theme="dark"
            ></div>

            <noscript>
                <a
                    class="preferred-source-fallback"
                    href="https://www.google.com/preferences/source?q=skyrscout.github.io"
                >
                    Add SkyrScout as a preferred source
                </a>
            </noscript>
        </div>
    {% endunless %}

</header>
